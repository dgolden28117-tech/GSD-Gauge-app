function shamrock(ctx,x,y,scale,color){

  ctx.bezierCurveTo(-16,-23,-6,-27,0,-20);
  ctx.bezierCurveTo(6,-27,16,-23,14,-14);
  ctx.bezierCurveTo(13,-6,3,-3,0,1);
  ctx.closePath();ctx.fill();ctx.restore();
 }

 ctx.restore();
}

function startupGauge(ctx,i,elapsed,v,time){
 const t=elapsed/1000, fade=(a,b)=>clamp((t-a)/(b-a),0,1), C=150, TAU=Math.PI*2;
 // Hand-drawn angular, wide motorsport letterforms, instead of browser italic type.
 // Coordinates use a 100 x 72 letter grid; the shapes stay identical on iOS and desktop.
 const glyphs=[
  [ [[15,7],[92,7],[81,21],[34,21],[19,52],[65,52],[71,40],[49,40],[57,29],[94,29],[78,65],[11,65],[2,56]] ],
  [ [[21,7],[96,7],[84,22],[38,22],[32,29],[79,29],[90,38],[77,57],[63,65],[3,65],[15,50],[61,50],[68,42],[21,42],[8,34]] ],
  [ [[16,7],[73,7],[91,19],[88,44],[72,65],[3,65]], [[36,22],[65,22],[75,28],[72,43],[63,50],[22,50]] ]
 ];
 function pathPolygon(pts){ctx.beginPath();pts.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
 function letterFace(alpha){
  ctx.save();ctx.clearRect(0,0,300,300);
  if(referenceFaces[i].complete&&referenceFaces[i].naturalWidth)ctx.drawImage(referenceFaces[i],0,0,300,300);
  ctx.beginPath();ctx.arc(C,C,123,0,TAU);ctx.clip();ctx.fillStyle='#020104';ctx.fillRect(0,0,300,300);
  // Thin purple perimeter and subtle lower honeycomb remain visible during reveal.
  ctx.strokeStyle='#7a229c';ctx.globalAlpha=.75;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(C,C,117,0,TAU);ctx.stroke();
  ctx.globalAlpha=alpha;
  // Center each actual glyph's transformed bounding box on the 300x300 display.
  const points=glyphs[i][0],xs=points.map(p=>1.6*p[0]-.27*p[1]),ys=points.map(p=>1.6*p[1]);
  const offsetX=150-(Math.min(...xs)+Math.max(...xs))/2;
  const offsetY=150-(Math.min(...ys)+Math.max(...ys))/2;
  ctx.translate(offsetX,offsetY);ctx.transform(1.6,0,-.27,1.6,0,0);
  ctx.shadowColor='#b83aff';ctx.shadowBlur=19;ctx.fillStyle='#fdf6ff';
  pathPolygon(glyphs[i][0]);ctx.fill();
  if(i===2){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.shadowBlur=0;pathPolygon(glyphs[i][1]);ctx.fill();ctx.restore();}
  ctx.restore();
 }
 if(t<1.2){letterFace(fade(0,1.2));return;}
 if(t<2.5){
  // Fade the three letters out before revealing the center logo.
  // The startup logo uses a true alpha-transparent image; no white rectangle is embedded.
  const progress=fade(1.2,2.5);
  const letterOpacity=1-clamp(progress/.34,0,1);
  letterFace(Math.max(0,letterOpacity));
  if(i===1 && progress>=.34){
    ctx.save();
    ctx.beginPath();ctx.arc(150,150,122,0,TAU);ctx.clip();
    // Solid white immediately beneath the logo, rather than fading the
    // background behind a faster-fading opaque rectangular image.
    ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,300,300);
    if(headerStartupLogo.complete && headerStartupLogo.naturalWidth){
      const logoOpacity=Math.min(1,(progress-.34)/.23,(1-progress)/.18);
      ctx.globalAlpha=clamp(logoOpacity,0,1);
      ctx.shadowColor='transparent';ctx.shadowBlur=0;
      ctx.drawImage(headerStartupLogo,76,76,148,148);
    }
    ctx.restore();
  }else if(i!==1){
    // Outside gauges fade to pure black without affecting the metallic bezel.
    ctx.save();ctx.beginPath();ctx.arc(150,150,122,0,TAU);ctx.clip();
    ctx.globalAlpha=clamp(progress/.34,0,1);ctx.fillStyle='#020104';ctx.fillRect(0,0,300,300);ctx.restore();
  }
  return;
 }
 // Slower 1.8-second sweep: 0->maximum then maximum->zero.
 const q=clamp((t-2.5)/1.8,0,1), sweep=q<.5?q*2:(1-q)*2;
 const demo={...v,boost:30*sweep,afr:11+7*sweep,iat:200*sweep,egt:1320*sweep};
 const oldColors=state.colors,oldGreen=state.boostGreen,oldYellow=state.boostYellow,oldRed=state.boostRed,oldLow=state.afrLow,oldHigh=state.afrHigh,oldIat=state.iatWarn,oldEgt=state.egtWarn;
 try{
  state.colors=['#b450ff','#b450ff','#b450ff'];state.boostGreen=30;state.boostYellow=30;state.boostRed=30;state.afrLow=10;state.afrHigh=19;state.iatWarn=250;state.egtWarn=1650;
  gauge(ctx,i,demo,time,true);
  ctx.save();ctx.beginPath();ctx.arc(150,150,119,0,TAU);ctx.strokeStyle='#26132e';ctx.lineWidth=6;ctx.stroke();
  const start=i===2?-Math.PI/2:Math.PI*.75;
  ctx.beginPath();ctx.arc(150,150,119,start,start+(i===2?Math.PI:Math.PI*1.5)*sweep);
  ctx.strokeStyle='#bb5aff';ctx.lineWidth=7;ctx.shadowColor='#ad3aff';ctx.shadowBlur=15;ctx.stroke();ctx.restore();
 }finally{state.colors=oldColors;state.boostGreen=oldGreen;state.boostYellow=oldYellow;state.boostRed=oldRed;state.afrLow=oldLow;state.afrHigh=oldHigh;state.iatWarn=oldIat;state.egtWarn=oldEgt;}
}

function readout(label,v){switch(label){case 'Oil Temperature':return{name:'OIL TEMP',value:v.oil,unit:'°F',pct:v.oil/300};case 'Coolant Temperature':return{name:'COOLANT',value:v.coolant,unit:'°F',pct:v.coolant/260};case 'Engine RPM':return{name:'RPM',value:v.rpm,unit:'RPM',pct:v.rpm/7000};case 'Boost Pressure':return{name:'BOOST',value:v.boost.toFixed(1),unit:'PSI',pct:clamp(v.boost/30,0,1)};case 'Air/Fuel Ratio':return{name:'AFR',value:v.afr.toFixed(1),unit:':1',pct:(v.afr-10)/9};default:return{name:'IAT / EGT',value:Math.round(v.iat)+' / '+Math.round(v.egt),unit:'°F',pct:v.egt/1650}}}
const metric=(name,id,unit)=>`<div class="stat"><small>${name} / ${unit}</small><strong id="m-${id}">—</strong></div>`;
const slider=(name,id,min,max,step,value)=>`<div class="field"><div class="line"><label for="${id}">${name}</label><strong class="value" id="v-${id}">${value}</strong></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;

function syncHoneycomb(){
  // Honeycomb selection affects only the hexagon outlines, never the black canvas or panels.
  const color=state.backgrounds[0]||'#b85aff';
  const intensity=Math.max(0,Math.min(100,Number(state.honeycomb)||0))/100;
  const hexPath='M12 1L24 8V22L12 29L0 22V8ZM36 1L48 8V22L36 29L24 22V8ZM24 22L36 29V43L24 50L12 43V29Z';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="48" height="42" viewBox="0 0 48 42"><defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.9"/></filter></defs><path d="${hexPath}" fill="none" stroke="${color}" stroke-opacity="${(intensity*.68).toFixed(3)}" stroke-width="3.1" filter="url(#glow)"/><path d="${hexPath}" fill="none" stroke="${color}" stroke-opacity="${(intensity*.92).toFixed(3)}" stroke-width="1.15"/></svg>`;
  document.body.style.backgroundColor='#08090b';
  document.body.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  document.body.style.backgroundSize='48px 42px';
}

function render(){syncHoneycomb();all('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));all('[data-gauge]').forEach(b=>b.classList.toggle('active',+b.dataset.gauge===state.selected));let h='';if(state.tab==='engine'){h=`<div class="line"><strong class="title">ENGINE INPUT SIMULATOR</strong><span class="micro" id="mode">MANUAL</span></div><div class="stats">${metric('BOOST','boost','PSI')}${metric('AFR','afr',':1')}${metric('INTAKE','iat','°F')}${metric('EXHAUST','egt','°F')}</div>${slider('ENGINE SPEED','rpm',700,7000,50,engine.rpm)}${slider('THROTTLE','throttle',0,100,1,engine.throttle)}${slider('ENGINE LOAD','load',0,100,1,engine.load)}<div class="actions"><button class="action" id="auto">${engine.auto?'STOP AUTO DRIVE':'START AUTO DRIVE'}</button><button class="action alt" id="idle">RESET TO IDLE</button></div><p class="note">Simulated values are illustrative, not measured ECU data or safe engine limits.</p>`}else if(state.tab==='gauges'){let i=state.selected;h=`<div class="line"><strong class="title">GAUGE ${i+1} / CONFIGURATION</strong><span class="micro">SELECT GAUGE ABOVE</span></div><div class="field"><label for="readout">DISPLAY ASSIGNMENT</label><select id="readout">${['Boost Pressure','Air/Fuel Ratio','IAT / EGT','Oil Temperature','Coolant Temperature','Engine RPM'].map(x=>`<option ${state.labels[i]===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><button class="action alt" id="restore-gauges">RESTORE APPROVED BOOST / AFR / IAT–EGT LAYOUT</button></div>`;const configs=i===0?[['boostGreen','GREEN ZONE START',0,25,1,'PSI'],['boostYellow','YELLOW ZONE START',0,29,1,'PSI'],['boostRed','RED WARNING START',1,30,1,'PSI']]:i===1?[['afrLow','AFR LOWER WARNING',10,16,.1,':1'],['afrHigh','AFR UPPER WARNING',13,19,.1,':1']]:[['iatWarn','IAT WARNING',70,220,5,'°F'],['egtWarn','EGT WARNING',500,1650,25,'°F']];configs.forEach(([key,name,min,max,step,unit])=>{h+=slider(name+' / '+unit,key,min,max,step,state[key])});h+='<p class="note">Purple is the normal sweep color. Warning colors appear at configured thresholds. Only the red boost segment flashes.</p>'}else if(state.tab==='display'){h=`<strong class="title">ALL 3 GAUGES — SHARED COLORS</strong><div class="field shared-color-field"><label>SWEEP COLOR — ALL 3 GAUGES</label><div class="line custom-color-row"><label for="all-sweep-custom">SELECT SWEEP COLOR</label><input id="all-sweep-custom" type="color" value="${state.colors[0]}" aria-label="Custom sweep color for all three gauges"></div></div><div class="field shared-color-field"><label>HONEYCOMB COLOR — GAUGES + WEB APP</label><div class="line custom-color-row"><label for="all-face-custom">SELECT HONEYCOMB COLOR</label><input id="all-face-custom" type="color" value="${state.backgrounds[0]}" aria-label="Custom honeycomb color for gauges and app"></div></div>${slider('BRIGHTNESS / %','brightness',10,100,1,state.brightness)}${slider('HONEYCOMB INTENSITY / %','honeycomb',0,100,1,state.honeycomb)}<p class="note">Honeycomb color changes only the glowing hexagon outlines; gauge faces and app panels stay black. Sweep colors and warning zones remain separate.</p>`}else{h='<strong class="title">SYSTEM STATUS</strong><div class="stats">'+metric('MODE','mode','')+metric('DISPLAYS','displays','')+'</div><p class="note">This is a standalone iPhone-compatible simulation. No ESP32 or OBD2 connection is active. Settings are stored in this browser when storage is permitted.</p><div class="actions"><button class="action alt" id="reset">RESET ALL SETTINGS</button></div>'}$('#panel').innerHTML=h;
if(state.tab==='engine'){['rpm','throttle','load'].forEach(k=>{$('#'+k).oninput=e=>{engine[k]=+e.target.value;$('#v-'+k).textContent=engine[k]}});$('#auto').onclick=()=>{engine.auto=!engine.auto;render()};$('#idle').onclick=()=>{engine.auto=false;Object.assign(engine,{rpm:850,throttle:0,load:12});render()}}else if(state.tab==='gauges'){$('#readout').onchange=e=>{state.labels[state.selected]=e.target.value;save();render()};$('#restore-gauges').onclick=()=>{state.labels=['Boost Pressure','Air/Fuel Ratio','IAT / EGT'];state.colors=['#a65aff','#a65aff','#a65aff'];state.boostGreen=15;state.boostYellow=20;state.boostRed=25;state.backgrounds=['#b85aff','#b85aff','#b85aff'];save();render()};const keys=state.selected===0?['boostGreen','boostYellow','boostRed']:state.selected===1?['afrLow','afrHigh']:['iatWarn','egtWarn'];keys.forEach(k=>{$('#'+k).oninput=e=>{state[k]=+e.target.value;$('#v-'+k).textContent=state[k];syncHoneycomb();save()}})}else if(state.tab==='display'){all('[data-all-color]').forEach(b=>b.onclick=()=>{state.colors=Array(3).fill(b.dataset.allColor);save();render()});all('[data-all-background]').forEach(b=>b.onclick=()=>{state.backgrounds=Array(3).fill(b.dataset.allBackground);save();render()});$('#all-sweep-custom').oninput=e=>{state.colors=Array(3).fill(e.target.value);save()};$('#all-sweep-custom').onchange=e=>{state.colors=Array(3).fill(e.target.value);save();render()};$('#all-face-custom').oninput=e=>{state.backgrounds=Array(3).fill(e.target.value);syncHoneycomb();save()};$('#all-face-custom').onchange=e=>{state.backgrounds=Array(3).fill(e.target.value);syncHoneycomb();save();render()};['brightness','honeycomb'].forEach(k=>{$('#'+k).oninput=e=>{state[k]=+e.target.value;$('#v-'+k).textContent=state[k];syncHoneycomb();save()}})}else{$('#m-mode').textContent='DEMO';$('#m-displays').textContent='3';$('#reset').onclick=()=>{state={...defaults,colors:defaults.colors.slice(),labels:defaults.labels.slice()};save();render()}}}
all('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});all('[data-gauge]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.gauge;state.tab='gauges';save();render()});
function frame(now){if(engine.auto){const t=(now-t0)/1000;engine.rpm=Math.round(900+(Math.sin(t*.65)+1)*2700);engine.throttle=Math.round(clamp((Math.sin(t*.65-.5)+1)*50,0,100));engine.load=Math.round(12+engine.throttle*.83);if(state.tab==='engine'){for(const k of ['rpm','throttle','load']){let input=$('#'+k),out=$('#v-'+k);if(input)input.value=engine[k];if(out)out.textContent=engine[k]}}}const v=data();all('.gauge canvas').forEach((c,i)=>{const ctx=c.getContext('2d');if(ctx)gauge(ctx,i,v,now)});if(state.tab==='engine'){for(const k of ['boost','afr','iat','egt']){const e=$('#m-'+k);if(e)e.textContent=k==='boost'||k==='afr'?v[k].toFixed(1):Math.round(v[k])}let m=$('#mode');if(m)m.textContent=engine.auto?'AUTO DRIVE':'MANUAL'}requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
})();
</script></body></html>
