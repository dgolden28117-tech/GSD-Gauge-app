<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>GSD Gauge Control</title><style>
:root{color-scheme:dark;font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif;background:#08090b;color:#eee}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:22px 14px 60px}header,.line,.tabs,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:19px;letter-spacing:2px;font-weight:800}.brand b{color:#ed2845;margin-right:9px}.sub,.micro,label{font-size:11px;color:#90939b;letter-spacing:1.6px;text-transform:uppercase}header{padding-bottom:17px;border-bottom:1px solid #34363a}.status{font-size:11px;color:#aaa;letter-spacing:1px}.status:before{content:'●';color:#d6a34c;margin-right:7px}.sectionhead{padding:18px 0 10px}.sectionhead strong{font-size:12px;letter-spacing:1.6px}.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gauge{background:#101114;border:1px solid #292b31;padding:5px 3px 9px;color:inherit;cursor:pointer;border-radius:2px;min-width:0}.gauge.active{border-color:#d62442;box-shadow:inset 0 -2px #d62442}.gauge canvas{display:block;width:100%;aspect-ratio:1}.gauge small{font-size:10px;letter-spacing:1.3px;color:#b4b6bd}.tabs{border-bottom:1px solid #36373b;margin-top:20px;justify-content:flex-start;gap:20px;overflow-x:auto}.tabs button{background:none;color:#92959d;border:0;border-bottom:2px solid transparent;padding:13px 0 11px;font-size:12px;letter-spacing:1px;font-weight:700;cursor:pointer}.tabs button.active{color:white;border-bottom-color:#db2944}.panel{padding:20px 0}.line{margin-bottom:15px}.title{font-weight:750;letter-spacing:1.2px;font-size:14px}.field{border-top:1px solid #292b30;padding:16px 0}.field label{display:block;margin-bottom:9px}.field .line label{margin:0}select,input[type=number]{width:100%;background:#16181c;color:white;border:1px solid #45474e;border-radius:2px;padding:12px;font-size:16px}input[type=range]{width:100%;accent-color:#d62542;min-height:28px}.value{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:32px;height:32px;border:2px solid #333;cursor:pointer}.swatch.active{outline:2px solid #fff;outline-offset:2px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#333;margin:12px 0}.stat{background:#111215;padding:12px}.stat small{display:block;color:#9699a1;letter-spacing:1px;font-size:10px}.stat strong{display:block;font-size:24px;margin-top:5px;font-variant-numeric:tabular-nums}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:15px}button.action{border:1px solid #d62442;background:#c21f39;color:white;padding:12px 16px;font-size:12px;letter-spacing:1px;font-weight:700;cursor:pointer}button.action.alt{background:#17191e;border-color:#555}.note{font-size:12px;line-height:1.6;color:#9a9ca4}.footer{border-top:1px solid #34363a;padding-top:18px;margin-top:25px;color:#72757c;font-size:10px;letter-spacing:1px}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:430px){.app{padding:18px 10px 40px}.brand{font-size:16px}.gauges{gap:4px}.gauge{padding:3px 1px 8px}.gauge small{font-size:9px}.tabs{gap:16px}.tabs button{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="app"><header><div><div class="brand"><b>GSD</b> GAUGE CONTROL</div><div class="sub">DIGITAL COCKPIT / MK8 GTI</div></div><span class="status">SIMULATION</span></header><div class="sectionhead line"><strong>INSTRUMENTS</strong><span class="micro">3 × GC9A01 / 240 × 240</span></div><div class="gauges" id="gauges"><button class="gauge active" data-gauge="0"><canvas width="300" height="300" aria-label="Boost gauge"></canvas><small>BOOST</small></button><button class="gauge" data-gauge="1"><canvas width="300" height="300" aria-label="AFR gauge"></canvas><small>AFR</small></button><button class="gauge" data-gauge="2"><canvas width="300" height="300" aria-label="IAT EGT gauge"></canvas><small>IAT / EGT</small></button></div><nav class="tabs" aria-label="Controls"><button data-tab="engine" class="active">ENGINE</button><button data-tab="gauges">GAUGES</button><button data-tab="display">DISPLAY</button><button data-tab="system">SYSTEM</button></nav><section class="panel" id="panel"><p>Loading engine controls…</p></section><footer class="footer line"><span>GSD / TRIPLE GAUGE PROJECT</span><span>UI v2.7 · iPHONE</span></footer></main><script>
(function(){'use strict';
const $=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));const palette=['#a65aff','#de2949','#33d48d','#ffc33d','#4ca8ff','#ffffff'];
const defaults={selected:0,tab:'engine',colors:['#a65aff','#a65aff','#a65aff'],labels:['Boost Pressure','Air/Fuel Ratio','IAT / EGT'],boostGreen:15,boostYellow:20,boostRed:25,afrLow:12.5,afrHigh:15.5,iatWarn:120,egtWarn:1350,brightness:90,honeycomb:55};let state={...defaults};try{const s=JSON.parse(localStorage.getItem('gsd-v27')||'{}');for(const k of Object.keys(defaults))if(s[k]!==undefined)state[k]=s[k];if(!Array.isArray(state.colors)||state.colors.length!==3)state.colors=defaults.colors.slice();if(!Array.isArray(state.labels)||state.labels.length!==3)state.labels=defaults.labels.slice()}catch(e){};
const engine={rpm:850,throttle:0,load:12,auto:false};let t0=performance.now();const save=()=>{try{localStorage.setItem('gsd-v27',JSON.stringify(state))}catch(e){}};
function data(){const r=engine.rpm,t=engine.throttle,l=engine.load;const boost=clamp(-9+(t/100)*(r/100*.11+17)*(l/100+.3),-10,30);return {boost,afr:clamp(14.7-Math.max(0,boost)*.11+(t<10&&r>2300?3.1:0),10.5,19.5),iat:clamp(82+Math.max(0,boost)*.65+l*.16,65,180),egt:clamp(420+r*.09+l*4.4+Math.max(0,boost)*8,300,1650),oil:Math.round(190+l*.35),coolant:Math.round(194+l*.12),rpm:r,throttle:t,load:l}}
function text(ctx,str,x,y,size,color='#fff',weight=700){ctx.fillStyle=color;ctx.font=`${weight} ${size}px 'Arial Narrow',Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(str),x,y)}
function arc(ctx,r,a,b,color,width=8){ctx.beginPath();ctx.arc(150,150,r,a,b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='butt';ctx.stroke()}
function gauge(ctx,i,v,time){ctx.clearRect(0,0,300,300);ctx.save();ctx.globalAlpha=clamp(state.brightness/100,.1,1);ctx.fillStyle='#050508';ctx.beginPath();ctx.arc(150,150,145,0,Math.PI*2);ctx.fill();arc(ctx,141,0,Math.PI*2,'#77747d',4);arc(ctx,135,0,Math.PI*2,'#181821',6);ctx.save();ctx.beginPath();ctx.arc(150,150,126,0,Math.PI*2);ctx.clip();ctx.globalAlpha=state.honeycomb/100*.34;ctx.strokeStyle='#78459e';ctx.lineWidth=1;for(let row=-1;row<19;row++)for(let col=-1;col<18;col++){let x=col*21+(row%2)*10,y=row*18;ctx.beginPath();for(let p=0;p<=6;p++){let a=Math.PI/3*p;let xx=x+12*Math.cos(a),yy=y+12*Math.sin(a);p?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}ctx.restore();
const start=Math.PI*.75,end=Math.PI*2.25,span=end-start;arc(ctx,119,start,end,'#292332',10);const base=state.colors[i]||palette[0];const label=state.labels[i];
if(i===0&&label==='Boost Pressure'){const f=x=>start+clamp(x/30,0,1)*span;const p=clamp(v.boost,0,30);const zones=[[0,state.boostGreen,base],[state.boostGreen,state.boostYellow,'#37d985'],[state.boostYellow,state.boostRed,'#ffd044'],[state.boostRed,30,'#ff304a']];zones.forEach(([a,b,c])=>{if(p>a&&b>a){const aa=f(a),bb=f(Math.min(b,p));if(c==='#ff304a'&&p>=state.boostRed&&Math.floor(time/350)%2===0)return;arc(ctx,119,aa,bb,c,10)}})}else if(i===1&&label==='Air/Fuel Ratio'){const p=clamp((v.afr-10)/9,0,1);const c=v.afr<state.afrLow||v.afr>state.afrHigh?'#ff344c':base;arc(ctx,119,start,start+p*span,c,10)}else if(i===2&&label==='IAT / EGT'){arc(ctx,119,Math.PI*1.5,Math.PI*.5,'#292332',9);arc(ctx,107,Math.PI*1.5,Math.PI*.5,'#292332',8);arc(ctx,119,Math.PI*1.5,Math.PI*1.5-clamp(v.iat/250,0,1)*Math.PI,v.iat>=state.iatWarn?'#ff344c':'#35dba0',9);arc(ctx,107,Math.PI*1.5,Math.PI*1.5+clamp(v.egt/1650,0,1)*Math.PI,v.egt>=state.egtWarn?'#ff344c':base,8)}else{let d=readout(label,v);arc(ctx,119,start,start+clamp(d.pct,0,1)*span,base,10)}
for(let j=0;j<=10;j++){let a=start+j/10*span;let x1=150+105*Math.cos(a),y1=150+105*Math.sin(a),x2=150+(j%2?110:114)*Math.cos(a),y2=150+(j%2?110:114)*Math.sin(a);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='#b9b6c1';ctx.lineWidth=j%2?1:2;ctx.stroke()}
if(i===0&&label==='Boost Pressure'){text(ctx,'BOOST',150,110,18);text(ctx,v.boost.toFixed(1),150,157,45);text(ctx,'PSI',150,190,15,'#c4c4cb');text(ctx,'0',45,210,13,'#ddd');text(ctx,'15',150,35,13,'#ddd');text(ctx,'30',255,210,13,'#ddd')}else if(i===1&&label==='Air/Fuel Ratio'){text(ctx,'AFR',150,108,20);text(ctx,v.afr.toFixed(1),150,159,47);text(ctx,':1',150,193,15,'#c4c4cb');text(ctx,'12',48,210,13,'#ddd');text(ctx,'14',150,34,13,'#ddd');text(ctx,'17',251,210,13,'#ddd')}else if(i===2&&label==='IAT / EGT'){text(ctx,'0',150,34,13);text(ctx,'IAT',92,114,17);text(ctx,'EGT',207,114,17);text(ctx,Math.round(v.iat)+'°',92,154,27);text(ctx,Math.round(v.egt)+'°',207,154,26);text(ctx,'F',92,180,13,'#aaa');text(ctx,'F',207,180,13,'#aaa');ctx.strokeStyle='#51435f';ctx.beginPath();ctx.moveTo(150,91);ctx.lineTo(150,207);ctx.stroke()}else{const d=readout(label,v);text(ctx,d.name,150,112,17);text(ctx,d.value,150,157,40);text(ctx,d.unit,150,192,15,'#aaa')}text(ctx,'GSD',150,241,19,'#e2e2e6',800);ctx.restore()}
function readout(label,v){switch(label){case 'Oil Temperature':return{name:'OIL TEMP',value:v.oil,unit:'°F',pct:v.oil/300};case 'Coolant Temperature':return{name:'COOLANT',value:v.coolant,unit:'°F',pct:v.coolant/260};case 'Engine RPM':return{name:'RPM',value:v.rpm,unit:'RPM',pct:v.rpm/7000};case 'Boost Pressure':return{name:'BOOST',value:v.boost.toFixed(1),unit:'PSI',pct:clamp(v.boost/30,0,1)};case 'Air/Fuel Ratio':return{name:'AFR',value:v.afr.toFixed(1),unit:':1',pct:(v.afr-10)/9};default:return{name:'IAT / EGT',value:Math.round(v.iat)+' / '+Math.round(v.egt),unit:'°F',pct:v.egt/1650}}}
const metric=(name,id,unit)=>`<div class="stat"><small>${name} / ${unit}</small><strong id="m-${id}">—</strong></div>`;
const slider=(name,id,min,max,step,value)=>`<div class="field"><div class="line"><label for="${id}">${name}</label><strong class="value" id="v-${id}">${value}</strong></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;
function render(){all('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));all('[data-gauge]').forEach(b=>b.classList.toggle('active',+b.dataset.gauge===state.selected));let h='';if(state.tab==='engine'){h=`<div class="line"><strong class="title">ENGINE INPUT SIMULATOR</strong><span class="micro" id="mode">MANUAL</span></div><div class="stats">${metric('BOOST','boost','PSI')}${metric('AFR','afr',':1')}${metric('INTAKE','iat','°F')}${metric('EXHAUST','egt','°F')}</div>${slider('ENGINE SPEED','rpm',700,7000,50,engine.rpm)}${slider('THROTTLE','throttle',0,100,1,engine.throttle)}${slider('ENGINE LOAD','load',0,100,1,engine.load)}<div class="actions"><button class="action" id="auto">${engine.auto?'STOP AUTO DRIVE':'START AUTO DRIVE'}</button><button class="action alt" id="idle">RESET TO IDLE</button></div><p class="note">Simulated values are illustrative, not measured ECU data or safe engine limits.</p>`}else if(state.tab==='gauges'){let i=state.selected;h=`<div class="line"><strong class="title">GAUGE ${i+1} / CONFIGURATION</strong><span class="micro">SELECT GAUGE ABOVE</span></div><div class="field"><label for="readout">DISPLAY ASSIGNMENT</label><select id="readout">${['Boost Pressure','Air/Fuel Ratio','IAT / EGT','Oil Temperature','Coolant Temperature','Engine RPM'].map(x=>`<option ${state.labels[i]===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>BASE SWEEP COLOR</label><div class="swatches">${palette.map(c=>`<button class="swatch ${state.colors[i]===c?'active':''}" data-color="${c}" style="background:${c}" aria-label="Select ${c}"></button>`).join('')}</div></div>`;const configs=i===0?[['boostGreen','GREEN ZONE START',0,25,1,'PSI'],['boostYellow','YELLOW ZONE START',0,29,1,'PSI'],['boostRed','RED WARNING START',1,30,1,'PSI']]:i===1?[['afrLow','AFR LOWER WARNING',10,16,.1,':1'],['afrHigh','AFR UPPER WARNING',13,19,.1,':1']]:[['iatWarn','IAT WARNING',70,220,5,'°F'],['egtWarn','EGT WARNING',500,1650,25,'°F']];configs.forEach(([key,name,min,max,step,unit])=>{h+=slider(name+' / '+unit,key,min,max,step,state[key])});h+='<p class="note">Purple is the normal sweep color. Warning colors appear at configured thresholds. Only the red boost segment flashes.</p>'}else if(state.tab==='display'){h=`<strong class="title">DISPLAY APPEARANCE</strong>${slider('BRIGHTNESS / %','brightness',10,100,1,state.brightness)}${slider('HONEYCOMB INTENSITY / %','honeycomb',0,100,1,state.honeycomb)}<p class="note">These settings affect the simulator. Physical display control will be added with ESP32 firmware.</p>`}else{h='<strong class="title">SYSTEM STATUS</strong><div class="stats">'+metric('MODE','mode','')+metric('DISPLAYS','displays','')+'</div><p class="note">This is a standalone iPhone-compatible simulation. No ESP32 or OBD2 connection is active. Settings are stored in this browser when storage is permitted.</p><div class="actions"><button class="action alt" id="reset">RESET ALL SETTINGS</button></div>'}$('#panel').innerHTML=h;
if(state.tab==='engine'){['rpm','throttle','load'].forEach(k=>{$('#'+k).oninput=e=>{engine[k]=+e.target.value;$('#v-'+k).textContent=engine[k]}});$('#auto').onclick=()=>{engine.auto=!engine.auto;render()};$('#idle').onclick=()=>{engine.auto=false;Object.assign(engine,{rpm:850,throttle:0,load:12});render()}}else if(state.tab==='gauges'){$('#readout').onchange=e=>{state.labels[state.selected]=e.target.value;save();render()};all('[data-color]').forEach(b=>b.onclick=()=>{state.colors[state.selected]=b.dataset.color;save();render()});const keys=state.selected===0?['boostGreen','boostYellow','boostRed']:state.selected===1?['afrLow','afrHigh']:['iatWarn','egtWarn'];keys.forEach(k=>{$('#'+k).oninput=e=>{state[k]=+e.target.value;$('#v-'+k).textContent=state[k];save()}})}else if(state.tab==='display'){['brightness','honeycomb'].forEach(k=>{$('#'+k).oninput=e=>{state[k]=+e.target.value;$('#v-'+k).textContent=state[k];save()}})}else{$('#m-mode').textContent='DEMO';$('#m-displays').textContent='3';$('#reset').onclick=()=>{state={...defaults,colors:defaults.colors.slice(),labels:defaults.labels.slice()};save();render()}}}
all('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});all('[data-gauge]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.gauge;state.tab='gauges';save();render()});
function frame(now){if(engine.auto){const t=(now-t0)/1000;engine.rpm=Math.round(900+(Math.sin(t*.65)+1)*2700);engine.throttle=Math.round(clamp((Math.sin(t*.65-.5)+1)*50,0,100));engine.load=Math.round(12+engine.throttle*.83);if(state.tab==='engine'){for(const k of ['rpm','throttle','load']){let input=$('#'+k),out=$('#v-'+k);if(input)input.value=engine[k];if(out)out.textContent=engine[k]}}}const v=data();all('.gauge canvas').forEach((c,i)=>{const ctx=c.getContext('2d');if(ctx)gauge(ctx,i,v,now)});if(state.tab==='engine'){for(const k of ['boost','afr','iat','egt']){const e=$('#m-'+k);if(e)e.textContent=k==='boost'||k==='afr'?v[k].toFixed(1):Math.round(v[k])}let m=$('#mode');if(m)m.textContent=engine.auto?'AUTO DRIVE':'MANUAL'}requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
})();
</script></body></html>
